server:
  port: 8080

auth:
  api_keys:
    - "key-abc-123"
    - "key-xyz-789"

rate_limit:
  requests_per_second: 10
  burst: 20

routes:
  - prefix: "/api/users"
    backends:
      - "http://localhost:3001"
      - "http://localhost:3002"
      - "http://localhost:3003"

health_check:
  interval: 10s
  timeout: 5s
  path: "/health"

circuit_breaker:
  max_failures: 5
  recovery_timeout: 30s

retry:
  max_attempts: 3
